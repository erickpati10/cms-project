<div class="panel panel-default">
  <div class="panel-body">
    <form id="contact-edit" (ngSubmit)="onSubmit(f)" #f="ngForm">
      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="name">Name:</label>
          <input
            type="text"
            id="name"
            class="form-control required"
            name="name"
            required
            size="120"
            max="120"
            #name="ngModel"
            [ngModel]="contact?.name"
          />
        </div>
      </div>

      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="email">Email:</label>
          <input
            type="text"
            id="email"
            class="form-control required invalid"
            name="email"
            required
            size="120"
            max="255"
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,3}$"
            #email="ngModel"
            [ngModel]="contact?.email"
          />
          <div class="alert alert-danger" *ngIf="email.touched && email.invalid">
            You must enter a valid email.
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="phone">Phone:</label>
          <input
            type="text"
            id="phone"
            class="form-control"
            name="phone"
            size="150"
            max="255"
            pattern="\D*([2-9]\d{2})(\D*)([2-9]\d{2})(\D*)(\d{4})\D*"
            #phone="ngModel"
            [ngModel]="contact?.phone"
          />
          <div class="alert alert-danger" *ngIf="phone.touched && phone.invalid">
            Enter a valid phone number.
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="imageUrl">Image URL:</label>
          <input
            type="text"
            id="imageUrl"
            class="form-control"
            size="150"
            max="255"
            name="imageUrl"
            #imageUrl="ngModel"
            [ngModel]="contact?.imageUrl"
          />
        </div>
      </div>

      <div class="row">
        <div class="col-sm-12 form-group">
          <label>Group contacts</label>
          <div class="well well-sm">Drag contacts in group here</div>
        </div>
      </div>

      <div
        class="alert alert-danger"
        *ngIf="(name.touched && name.invalid) || (email.touched && email.invalid && !email.value)"
      >
        The Name and Email are required.
      </div>

      <div class="row">
        <div class="col-xs-12 btn-toolbar">
          <button class="btn btn-success" type="submit" [disabled]="!f.valid">Save</button>
          <button class="btn btn-primary" type="button" (click)="onCancel()">Cancel</button>
        </div>
      </div>
    </form>
  </div>
</div>
