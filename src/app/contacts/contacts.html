<div class="row">
  <div class="col-md-5">
    <!-- <h2>Contact-list goes here</h2> -->
    <app-contact-list (selectedContactEvent)="onSelectedContact($event)"></app-contact-list>
  </div>
  <div class="col-md-4">
    <!-- <h2>Contact-detail goes here</h2> -->

    <app-contact-detail *ngIf="selectedContact" [contact]="selectedContact"> </app-contact-detail>
  </div>
</div>
