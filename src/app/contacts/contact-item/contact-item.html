<a
  class="list-group-item clearfix"
  [routerLink]="[contact.id]"
  routerLinkActive="active"
  style="cursor: pointer"
>
  <div class="pull-left">
    {{ contact.name }}
  </div>

  <span class="pull-right">
    <img
      [src]="contact.imageUrl"
      alt="{{ contact.name }}"
      class="img-responsive"
      style="max-height: 60px"
    />
  </span>
</a>
