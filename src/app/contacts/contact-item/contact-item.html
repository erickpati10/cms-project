<a class="list-group-item clearfix" (click)="onClick()" style="cursor: pointer">
  <div class="pull-left">
    <h4 class="list-group-item-heading">{{ contact.name }}</h4>
  </div>
  <span class="pull-right">
    <img
      [src]="contact.imageUrl"
      alt="{{ contact.name }}"
      class="img-responsive"
      style="max-height: 60px"
    />
  </span>
</a>
