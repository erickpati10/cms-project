<div class="row">
  <div class="col-xs-12">
    <div class="panel panel-default">
      <div class="panel-heading clearfix">
        <h3 class="panel-title pull-left">Contacts</h3>
        <button class="btn btn-success pull-right">New Contact</button>
      </div>

      <ul class="list-group">
        <li class="list-group-item clearfix" *ngFor="let contact of contacts">
          <span class="pull-left">
            {{ contact.name }}
          </span>

          <span class="pull-right">
            <img
              [src]="contact.imageUrl"
              alt="{{ contact.name }}"
              class="img-responsive"
              style="max-height: 60px"
            />
          </span>
        </li>
      </ul>
    </div>
  </div>
</div>
